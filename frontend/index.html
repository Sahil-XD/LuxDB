<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>LuxDB</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>

            body {
                padding: 0;
                font-family: sans-serif;
            }

            #canvas-area{
                position: relative;
                min-height: calc(100vh - 57px);
                padding: 20px;
                background-color: #F1F5F9;
                background-image: radial-gradient(rgba(71, 85, 105, 0.16) 1.5px, transparent 1.5px);
                background-size: 24px 24px ;
            }

            .table-card{
                position: absolute;
                background: #ffffff ;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                width: 240px;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
                overflow: hidden;
                user-select: none;
            }

            .table-header{
                background: linear-gradient(135deg, #4f46e5, #06b6d4);
                color: white;
                font-weight: bold;
                font-size: 14px;
                padding: 8px 12px;
            }

            .col-row{
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 7px 12px;
                font-family: monospace;
                font-size: 12px;
                border-top: 1px solid #e2e8f0;
                color: #334155;
            }

            .pk-badge{
                background-color: #fef3c7;
                color: #b45309;
                font-size: 10px;
                font-weight: bold;
                padding: 1px 5px;
                border: 1px solid #fde68a;
                border-radius: 4px;
                margin-left: 6px;
            }

            #lines{
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }
        </style>
    </head>
    <body>

        <nav class="navbar bg-white border-bottom px-3">
            <span class="navbar-brand fw-bold">LuxDB</span>
            <button id="load-btn" class="btn btn-primary btn-sm">Load Schema</button>
        </nav>

        <div id="canvas-area"></div>

        <script>

            const btn = document.getElementById("load-btn");
            const canvas = document.getElementById("canvas-area");

            btn.addEventListener("click", async () => {
                const response = await fetch("http://localhost:8000/api/schema");
                const data = await response.json();

                canvas.innerHTML = `<svg id="lines"></svg>`;

                const cards = {};

                const drawLines = () => {
                    let lineText = "";
                    for (const rel of data.relationships) {
                        const a = cards[rel.from];
                        const b = cards[rel.to];
                        const x1 = a.offsetLeft + a.offsetWidth / 2;
                        const y1 = a.offsetTop + a.offsetHeight / 2;
                        const x2 = b.offsetLeft + b.offsetWidth / 2;
                        const y2 = b.offsetTop + b.offsetHeight / 2;
                        lineText += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#94a3b8" stroke-width="2" />`;
                    }
                    document.getElementById("lines").innerHTML = lineText;
                };

                let x=30;
                for(const tableName in data.table) {
                    const card = document.createElement("div");
                    card.className = "table-card";
                    card.innerHTML = `<div class="table-header">${tableName}</div>`;

                    for(const col of data.table[tableName]) {
                        const pkBadge = col.is_pk ? `<span class="pk-badge">PK</span>` : "";
                        card.innerHTML += `
                            <div class="col-row">
                                <span>${col.name}${pkBadge}</span>
                                <span>${col.type}</span>
                            </div>
                        `;
                    }

                    canvas.appendChild(card);
                    cards[tableName]=card;
                    card.style.left = x+"px";
                    card.style.top = "30px";
                    x+=280;

                    card.addEventListener("mousedown", (event) =>{
                        const grabX = event.clientX - card.offsetLeft;
                        const grabY = event.clientY - card.offsetTop;

                        const follow = (moveEvent) => {
                            card.style.left = (moveEvent.clientX - grabX) + "px";
                            card.style.top = (moveEvent.clientY - grabY) + "px";
                            drawLines();
                        };

                        document.addEventListener("mousemove",follow);

                        const stop = () => {
                            document.removeEventListener("mousemove",follow);
                            document.removeEventListener("mouseup",stop);
                        };

                        document.addEventListener("mouseup",stop);
                    });
                }
                drawLines();
            });
        </script>
    </body>
</html>
