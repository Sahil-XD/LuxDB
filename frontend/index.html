<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>LuxDB</title>

        <style>

            body {
                padding: 20px;
                font-family: sans-serif;
            }

            #load-btn {
                padding: 10px 16px;
                cursor: pointer;
            }

            #canvas-area{
                display: flex;
                gap: 20px;
                margin-top: 20px;
                flex-wrap: wrap;
            }

            .table-card{
                background: #ffffff ;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                width: 240px;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
                overflow: hidden;
            }

            .table-header{
                background: linear-gradient(135deg, #4f46e5, #06b6d4);
                color: white;
                font-weight: bold;
                font-size: 14px;
                padding: 8px 12px;
            }

            .col-row{
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 7px 12px;
                font-family: monospace;
                font-size: 12px;
                border-top: 1px solid #e2e8f0;
                color: #334155;
            }

            .pk-badge{
                background-color: #fef3c7;
                color: #b45309;
                font-size: 10px;
                font-weight: bold;
                padding: 1px 5px;
                border: 1px solid #fde68a;
                border-radius: 4px;
                margin-left: 6px;
            }

        </style>
    </head>
    <body>

        <h1>LuxDB</h1>
        <p>Database Visualizer</p>

        <button id="load-btn">
            Load Schema
        </button>

        <div id="canvas-area"></div>

        <script>

            const btn = document.getElementById("load-btn");
            const canvas = document.getElementById("canvas-area");

            btn.addEventListener("click", async () => {
                const response = await fetch("http://localhost:8000/api/schema");
                const data = await response.json();

                canvas.innerHTML = "";
                for(const tableName in data.table) {
                    const card = document.createElement("div");
                    card.className = "table-card";
                    card.innerHTML = `<div class="table-header">${tableName}</div>`;

                    for(const col of data.table[tableName]) {
                        const pkBadge = col.is_pk ? `<span class="pk-badge">PK</span>` : "";
                        card.innerHTML += `
                            <div class="col-row">
                                <span>${col.name}${pkBadge}</span>
                                <span>${col.type}</span>
                            </div>
                        `;
                    }

                    canvas.appendChild(card);
                }
            });
        </script>
    </body>
</html>
